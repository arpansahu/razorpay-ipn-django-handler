name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m django test razorpay_ipn_django_handler
        env:
          DJANGO_SETTINGS_MODULE: test_settings
      - run: python -m django makemigrations razorpay_ipn_django_handler --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: test_settings